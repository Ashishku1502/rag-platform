services:
  - type: web
    name: rag-backend
    env: docker
    region: ohio
    plan: free
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: CHROMA_PATH
        value: /data/chroma
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 1
